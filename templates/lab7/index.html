{% extends "base.html" %}

{% block lab %}Лабораторная работа 7{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='lab7/main.js') }}"></script>
{% endblock %}
    {% block style %}
    <link rel="stylesheet" href="{{ url_for('static', filename='lab7/style.css') }}">
{% endblock %}
{% block main %}
<h1>Список фильмов</h1>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>Название</th>
            <th>Название (RU)</th>
            <th>Год</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody id="film-list"></tbody>
</table>

<h3>Добавить / редактировать фильм</h3>
<input id="title" placeholder="Оригинальное название">
<input id="title_ru" placeholder="Название на русском">
<input id="year" type="number" placeholder="Год">
<textarea id="description" placeholder="Описание"></textarea>
<br><br>
<button onclick="saveFilm()">Сохранить</button>

<script>
    fillFilmList();
</script>
{% endblock %}
