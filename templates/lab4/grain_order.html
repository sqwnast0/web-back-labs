{% extends "base.html" %}

{% block lab %}Заказ зерна{% endblock %}

{% block main %}
    <h1>Заказ зерна</h1>
    <form method="post">
        <label for="grain">Выберите зерно:</label>
        <select id="grain" name="grain" required>
            <option value="barley">Ячмень</option>
            <option value="oats">Овёс</option>
            <option value="wheat">Пшеница</option>
            <option value="rye">Рожь</option>
        </select>
        <br>
        <label for="weight">Вес (в тоннах):</label>
        <input type="number" id="weight" name="weight" min="0" required>
        <br>
        <button type="submit">Заказать</button>
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
{% endblock %}
